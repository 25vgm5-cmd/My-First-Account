name: Build MyFirst Account Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Licenses
        run: |
          set +eo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -d "$SDK_DIR" ]; then
            echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
            SDKMANAGER=""
            for candidate in \
              "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
              "$SDK_DIR"/cmdline-tools/*/bin/sdkmanager \
              "$SDK_DIR/tools/bin/sdkmanager" \
              "$(command -v sdkmanager 2>/dev/null)"; do
              if [ -n "$candidate" ] && [ -x "$candidate" ]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
            if [ -n "$SDKMANAGER" ]; then
              yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
              "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
            fi
          fi
          exit 0

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web assets
        run: npm run build

      - name: Initialize Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Apply MyFirst App launcher icons & adaptive background
        run: |
          if [ -f "public/pwa-512x512.png" ]; then
            FOREGROUND_ICON="public/pwa-512x512.png"
            if [ -f "public/pwa-maskable-512x512.png" ]; then
              FOREGROUND_ICON="public/pwa-maskable-512x512.png"
            fi
            for dir in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
              if [ -d "$dir" ]; then
                cp -f public/pwa-512x512.png "$dir/ic_launcher.png"
                cp -f public/pwa-512x512.png "$dir/ic_launcher_round.png"
                cp -f "$FOREGROUND_ICON" "$dir/ic_launcher_foreground.png"
              fi
            done
          fi
          if [ -f "android/app/src/main/res/values/ic_launcher_background.xml" ]; then
            sed -i -E 's/#[0-9A-Fa-f]{6}/#0B1B3B/g' android/app/src/main/res/values/ic_launcher_background.xml
          fi
        continue-on-error: true

      - name: Configure Fixed Android Signing Key & App Version
        run: |
          mkdir -p "$HOME/.android"
          if [ -f "scripts/android-debug.keystore" ]; then
            cp -f "scripts/android-debug.keystore" "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
          fi
          APP_VER=$(node -e "const fs=require('fs');const m=fs.readFileSync('src/types/finance.ts','utf8').match(/APP_VERSION\\s*=\\s*'([^']+)'/);console.log(m?m[1]:'1.0');")
          VER_CODE=$(node -e "const v='$APP_VER'.split('.').map(Number);console.log((v[0]||1)*100+(v[1]||0));")
          echo "Syncing Android build.gradle -> versionName=$APP_VER, versionCode=$VER_CODE"
          if [ -f "android/app/build.gradle" ]; then
            sed -i -E "s/versionCode [0-9]+/versionCode $VER_CODE/" android/app/build.gradle
            sed -i -E "s/versionName \"[^\"]+\"/versionName \"$APP_VER\"/" android/app/build.gradle
          fi

      - name: Sync Capacitor Android assets & plugins
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyFirst-App-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Windows Standalone Single HTML
        run: npm run build:html

      - name: Upload Single HTML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyFirst-Account-Single-HTML
          path: dist-single/MyFirstAccount.html
          if-no-files-found: error
          retention-days: 30
